name: Validate Interactive Lab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Install browser test runtime
        run: npx playwright@1.55.0 install --with-deps chromium
      - run: npm run validate
      - name: Verify discovery files
        run: |
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          test -f _redirects
          grep -q "WebApplication" index.html
          grep -q "prefers-reduced-motion" styles.css
      - name: Runtime smoke test
        run: node smoke.mjs
