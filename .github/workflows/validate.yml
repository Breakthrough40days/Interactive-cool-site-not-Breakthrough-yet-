name: Validate Interactive Lab
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run build
      - name: Verify discovery files
        run: |
          test -f robots.txt
          test -f sitemap.xml
          test -f llms.txt
          test -f _redirects
          grep -q "WebApplication" index.html
          grep -q "prefers-reduced-motion" styles.css
