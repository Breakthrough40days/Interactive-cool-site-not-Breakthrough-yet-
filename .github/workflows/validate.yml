name: Validate Interactive Lab
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm install
      - name: Static and production build
        run: npm run validate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: npm run smoke
